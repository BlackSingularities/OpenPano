[package]
name = "panoramer"
version = "1.0.0"
edition = "2021"
description = "Professional panorama stitcher: spherical, cylindrical, 360° and more, with RAW/DNG support"
license = "GPL-3.0-or-later"
repository = "https://github.com/BlackSingularities/Panoramer"
authors = ["Panoramer contributors"]
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
rayon = "1.10"
nalgebra = "0.33"
rawloader = "0.37"
kamadak-exif = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
half = "2"
flate2 = "1"
anyhow = "1"
sys-locale = "0.3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
