[package]
name = "openpano"
version.workspace = true
edition = "2021"
description = "OpenPano - professional panorama stitcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/BlackSingularities/OpenPano"
authors = ["redzikowski.com"]

[lib]
name = "openpano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openpano-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1.10"
