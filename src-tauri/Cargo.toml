[package]
name = "panoramer"
version.workspace = true
edition = "2021"
description = "Panoramer - professional panorama stitcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/BlackSingularities/Panoramer"
authors = ["redzikowski.com"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
panoramer-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1.10"
directories = "5"
