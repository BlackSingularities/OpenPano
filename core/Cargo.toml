[package]
name = "openpano-core"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "exr"] }
rayon = "1.10"
nalgebra = "0.33"
rawloader = "0.37"
kamadak-exif = "0.5"
serde = { version = "1", features = ["derive"] }
half = "2"
flate2 = "1"
anyhow = "1"
sys-locale = "0.3"
rawler = { version = "0.7", optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", optional = true }

[features]
# Second RAW decoder (rawler / dnglab) for files rawloader cannot read, e.g. newer cameras,
# JPEG XL and lossy DNGs. Build with `--features openpano-core/rawler`.
rawler = ["dep:rawler"]
# GPU warp step (wgpu compute shader) with automatic CPU fallback.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
