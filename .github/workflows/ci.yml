name: CI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Type-check UI
        run: npm run check
      - name: Test engine
        run: cargo test --release -p openpano-core
      - name: Test engine with GPU and rawler features
        run: cargo test --release -p openpano-core --features gpu,rawler -- --nocapture gpu
      - name: Check optional features compile
        run: cargo check --release -p openpano-core --features gpu,rawler
      - name: Build app
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: openpano-exe
          path: target/release/openpano.exe
