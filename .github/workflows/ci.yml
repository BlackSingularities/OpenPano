name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Type-check UI
        run: npm run check
      - name: Test engine
        run: cargo test --release -p panoramer-core
      - name: Build app
        run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: panoramer-exe
          path: target/release/panoramer.exe
