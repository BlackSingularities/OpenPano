name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Test engine
        run: cargo test --release -p openpano-core
      - name: Build installer
        run: npx tauri build
      - name: Collect artifacts
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "dist-release/OpenPano-$v-setup-x64.exe" }
          Copy-Item target/release/openpano.exe "dist-release/OpenPano-$v-portable-x64.exe"
          Get-ChildItem dist-release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: OpenPano ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist-release/*

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build APK
        run: |
          npx tauri android init --ci
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "$KS_B64" | base64 -d > ks.p12
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*universal*release*.apk" | head -1)
          echo "unsigned: $APK"
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          mkdir -p out
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --out "out/OpenPano-$V-android.apk" aligned.apk
          $BT/apksigner verify "out/OpenPano-$V-android.apk"
          rm ks.p12
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.release.outputs.version) }}
          files: out/*.apk

  ios:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned IPA
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          npm run build
          npx tauri ios init --ci
          # Build the Rust library ourselves (the Xcode phase expects a running tauri CLI).
          cargo build --release --lib -p openpano --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp target/aarch64-apple-ios/release/libopenpano_lib.a src-tauri/gen/apple/Externals/arm64/release/libapp.a
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          # neutralise the "Build Rust Code" phase
          sed -i '' -E '/shellScript = .*xcode-script/s/shellScript = .*;/shellScript = "true";/' "$PROJ/project.pbxproj"
          if grep -q "xcode-script" "$PROJ/project.pbxproj"; then echo "build phase still present"; grep -n "xcode-script" "$PROJ/project.pbxproj" | head; exit 1; fi
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project: $PROJ scheme: $SCHEME"
          set -o pipefail
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release -sdk iphoneos -destination 'generic/platform=iOS'             -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -25
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "app: $APP"; ls -la "$APP" | head
          test -f "$APP/$(defaults read "$PWD/$APP/Info.plist" CFBundleExecutable)"
          mkdir -p Payload out && cp -R "$APP" Payload/
          zip -qr "out/OpenPano-$V-ios-unsigned.ipa" Payload
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.release.outputs.version) }}
          files: out/*.ipa
