name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer and portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\panoramer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target\release\panoramer.exe "dist\Panoramer-${{ steps.ver.outputs.version }}-portable-x64.exe"
          Compress-Archive -Path target\release\panoramer.exe, README.md, LICENSE -DestinationPath "dist\Panoramer-${{ steps.ver.outputs.version }}-portable-x64.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Panoramer ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
